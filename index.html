  <!-- Content data files (authored by content agents). The engine works even if these are absent.
       school10.js and school-other.js merge additional courses into the shared 'school' track. -->
  <script>
    // Defensive merge shim: some content files call __saMergeCourse. If none of them
    // defines it first, this guarantees the call always works regardless of load order.
    window.__saMergeCourse = window.__saMergeCourse || function (course) {
      var track = course.track || 'school';
      window.SHAHEEN_TRACKS = window.SHAHEEN_TRACKS || {};
      var t = window.SHAHEEN_TRACKS[track] = window.SHAHEEN_TRACKS[track] || { courses: [] };
      for (var i = 0; i < t.courses.length; i++) {
        if (t.courses[i].id === course.id) {
          var have = {};
          t.courses[i].chapters.forEach(function (ch) { have[ch.id] = 1; });
          course.chapters.forEach(function (ch) { if (!have[ch.id]) t.courses[i].chapters.push(ch); });
          return;
        }
      }
      t.courses.push(course);
    };
  </script>
