<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Mobile-first viewport; viewport-fit=cover for notched phones -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#046a4d">
  <title>Shaheen Academy — Learn Without Limits</title>
  <meta name="description" content="Shaheen Academy: free, mobile-first e-learning — school curriculum, test prep, and practical skills. Learn without limits.">

  <!-- PWA -->
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/svg+xml" href="./icons/favicon.svg">
  <link rel="apple-touch-icon" href="./icons/icon-192.svg">

  <!-- Fonts: clean Latin UI font + Urdu Nastaliq for Urdu text -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Noto+Nastaliq+Urdu:wght@400;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./styles.css">

  <!-- Content data files (authored by content agents). The engine works even if these are absent.
       school10.js and school-other.js merge additional courses into the shared 'school' track. -->
  <script>
    // Defensive merge shim: some content files call __saMergeCourse. If none of them
    // defines it first, this guarantees the call always works regardless of load order.
    window.__saMergeCourse = window.__saMergeCourse || function (course) {
      var track = course.track || 'school';
      window.SHAHEEN_TRACKS = window.SHAHEEN_TRACKS || {};
      var t = window.SHAHEEN_TRACKS[track] = window.SHAHEEN_TRACKS[track] || { courses: [] };
      for (var i = 0; i < t.courses.length; i++) {
        if (t.courses[i].id === course.id) {
          var have = {};
          t.courses[i].chapters.forEach(function (ch) { have[ch.id] = 1; });
          course.chapters.forEach(function (ch) { if (!have[ch.id]) t.courses[i].chapters.push(ch); });
          return;
        }
      }
      t.courses.push(course);
    };
  </script>
  <script src="./data/school.js" defer></script>
  <script src="./data/school10.js" defer></script>
  <script src="./data/school-other.js" defer></script>
  <script src="./data/testprep.js" defer></script>
  <script src="./data/skills.js" defer></script>
  <!-- App engine -->
  <script src="./app.js" defer></script>
</head>
<body>
  <!-- v2: top utility bar — live date (left) + visitor location (right), filled by JS -->
  <div class="utility-bar">
    <span class="util-item" id="util-date">Loading date…</span>
    <span class="util-item" id="util-location">📍 Pakistan</span>
  </div>

  <header class="app-header">
    <a class="brand" href="#/home" aria-label="Shaheen Academy home">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 512 512" width="36" height="36" role="img" aria-label="Shaheen falcon">
          <rect x="0" y="0" width="512" height="512" rx="116" fill="#034d38"/>
          <path fill="#c9a227" d="M150 400 L160 230 Q165 195 195 178 L250 150 L300 160 Q360 172 385 205 L400 232 L352 228 Q358 260 348 292 Q335 345 295 380 L235 408 Z"/>
          <path fill="#034d38" d="M270 212 Q292 202 312 210 Q296 226 274 224 Z"/>
          <path fill="#8a6d1a" opacity="0.6" d="M352 228 Q358 260 348 292 L330 285 Q340 260 336 232 Z"/>
        </svg>
      </span>
      <span class="brand-text">
        <span class="brand-name">Shaheen Academy</span>
        <span class="brand-tagline">Learn Without Limits</span>
      </span>
    </a>
    <!-- v2: auth area — "Join / Sign in" button or logged-in user chip, rendered by JS -->
    <div id="auth-area" aria-live="polite"></div>
  </header>

  <main id="app" aria-live="polite">
    <noscript>
      <section class="card empty">
        <h2>JavaScript is required</h2>
        <p>Shaheen Academy is an interactive learning app. Please enable JavaScript to continue.</p>
      </section>
    </noscript>
  </main>

  <nav class="bottom-nav" aria-label="Primary">
    <a href="#/home" data-route="home">
      <span class="nav-icon" aria-hidden="true">🏠</span>
      <span class="nav-label">Home</span>
    </a>
    <a href="#/search" data-route="search">
      <span class="nav-icon" aria-hidden="true">🔍</span>
      <span class="nav-label">Search</span>
    </a>
    <a href="#/progress" data-route="progress">
      <span class="nav-icon" aria-hidden="true">📊</span>
      <span class="nav-label">My Progress</span>
    </a>
    <a href="#/live" data-route="live">
      <span class="nav-icon" aria-hidden="true">🎥</span>
      <span class="nav-label">Live</span>
    </a>
  </nav>

  <!-- v2: modal root — auth dialog + mockup classroom are rendered here by JS -->
  <div id="modal-root"></div>
</body>
</html>
